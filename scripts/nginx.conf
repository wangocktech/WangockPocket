server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name wangock.tech;
    return 301 https://wangock.tech$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wangock.tech;
    root /var/www/wangock/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/wangock.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wangock.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    location /assets/sounds/ {
        types { audio/wav wav; }
        try_files $uri =404;
        expires 7d;
    }

    location ~ ^/(?:tests|scripts)/ { return 404; }
    location ~ /\. { deny all; }
}
